<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Torneo público – Fixture y tabla | Montería</title>
  <meta name="description" content="Fixture, resultados y tabla de posiciones del torneo de fútbol. Solo lectura." />
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/torneo-publico.css" />
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml" />
</head>
<body class="public-torneo-page frame-bust-pending" id="antiClickjackBody">
  <script src="js/frame-bust.js"></script>

  <header class="public-torneo-header">
    <div class="public-torneo-brand">
      <span aria-hidden="true">⚽</span>
      <select id="publicTournamentSelect" aria-label="Seleccionar Torneo" style="appearance: none; -webkit-appearance: none; background: transparent; border: none; font-size: 1.15rem; font-weight: 800; font-family: 'Inter', system-ui, sans-serif; color: var(--gray-900); cursor: pointer; outline: none; margin-left: 6px; padding-right: 18px; background-image: url('data:image/svg+xml;utf8,<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" width=\"14\" height=\"14\"><path d=\"M6 9l6 6 6-6\"/></svg>'); background-repeat: no-repeat; background-position: right center;">
        <option value="" disabled selected>Cargando Torneos...</option>
      </select>
    </div>
    <nav class="public-torneo-actions" aria-label="Accesos">
      <a href="index.html">Iniciar sesión</a>
      <a href="register.html">Regístrate</a>
    </nav>
  </header>

  <main class="public-torneo-main">
    <p class="public-torneo-intro" id="publicTournamentDesc">
      Vista pública para compartir: partidos y posiciones. Los datos dependen de lo que publique la organización en la plataforma.
    </p>

    <div id="publicStatus" class="public-status-msg" role="alert" aria-live="polite" hidden></div>

    <section class="public-section" aria-labelledby="fixtureHeading">
      <h2 id="fixtureHeading">Fixture</h2>
      <div id="publicFixture"></div>
    </section>

    <section class="public-section" aria-labelledby="standingsHeading">
      <h2 id="standingsHeading">Tabla de posiciones</h2>
      <div id="publicStandings"></div>
    </section>
  </main>

  <script src="js/vendor/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/db.js"></script>
  <script src="js/public-view.js"></script>
</body>
</html>
