<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Torneo público – Fixture y tabla | Montería</title>
  <meta name="description" content="Fixture, resultados y tabla de posiciones del torneo de fútbol. Solo lectura." />
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/torneo-publico.css" />
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml" />
</head>
<body class="public-torneo-page frame-bust-pending" id="antiClickjackBody">
  <script src="js/frame-bust.js"></script>

  <!-- ════ HERO HEADER ════ -->
  <header class="pub-hero">
    <div class="pub-hero__bg-blob"></div>

    <div class="pub-hero__top">
      <div class="pub-hero__brand">
        <span class="pub-hero__icon" aria-hidden="true">⚽</span>
        <span class="pub-hero__site-name">FutbolApp</span>
      </div>
      <nav class="pub-hero__nav" aria-label="Accesos">
        <a href="index.html" class="pub-btn pub-btn--ghost">Iniciar sesión</a>
        <a href="register.html" class="pub-btn pub-btn--primary">Regístrate</a>
      </nav>
    </div>

    <div class="pub-hero__center">
      <p class="pub-hero__label">Estás viendo el torneo</p>
      <div class="pub-hero__select-wrap">
        <span class="pub-hero__select-icon" aria-hidden="true">🏆</span>
        <select id="publicTournamentSelect" class="pub-hero__select" aria-label="Seleccionar Torneo">
          <option value="" disabled selected>Cargando torneos…</option>
        </select>
        <span class="pub-hero__chevron" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
            <path d="M5 7.5L10 12.5L15 7.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
      </div>
      <p id="publicTournamentDesc" class="pub-hero__desc">Vista pública · partidos y posiciones en tiempo real</p>
    </div>
  </header>

  <main class="public-torneo-main">
    <div id="publicStatus" class="public-status-msg" role="alert" aria-live="polite" hidden></div>

    <div class="public-tabs">
      <button class="public-tab active" data-sec="posiciones">📊 Posiciones</button>
      <button class="public-tab" data-sec="fixture">📅 Fixture</button>
      <button class="public-tab" data-sec="goleadores">⚽ Goleadores</button>
      <button class="public-tab" data-sec="valla">🧤 Valla Menos Vencida</button>
    </div>

    <div class="public-section active" id="sec-posiciones">
      <div id="publicStandings"></div>
    </div>

    <div class="public-section" id="sec-fixture">
      <div id="publicFixture"></div>
    </div>

    <div class="public-section" id="sec-goleadores">
      <div id="publicScorers" class="public-stars-grid"></div>
    </div>

    <div class="public-section" id="sec-valla">
      <div id="publicGoalkeepers" class="public-stars-grid"></div>
    </div>
  </main>

  <script src="js/vendor/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/db.js"></script>
  <script src="js/public-view.js"></script>
</body>
</html>
